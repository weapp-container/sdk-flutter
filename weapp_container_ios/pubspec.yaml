name: weapp_container_ios
description: Embeddable Weapp Container SDK for Flutter.
version: 0.1.0-preview.5.2
homepage: https://github.com/weapp-container/sdk-flutter
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    implements: weapp_container
    platforms:
      ios:
        pluginClass: WeappContainerIosPlugin
