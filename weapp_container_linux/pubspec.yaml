name: weapp_container_linux
description: Linux raster texture implementation of WeApp Container.
version: 0.1.0-preview.7.1
repository: https://github.com/weapp-container/sdk-flutter
issue_tracker: https://github.com/weapp-container/sdk-flutter/issues
homepage: https://github.com/weapp-container/sdk-flutter
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    implements: weapp_container
    platforms:
      linux:
        pluginClass: WeappContainerLinuxPlugin
