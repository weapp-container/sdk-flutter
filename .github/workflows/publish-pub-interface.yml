name: Publish verified platform interface
on:
  push:
    tags:
      - 'weapp_container_platform_interface-v*'
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Select a successful staging run at this exact source
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const runs = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/package-pub.yml/runs?head_sha=${sha}&status=success&per_page=100`])).workflow_runs;
          const run = runs.find(run => run.status === 'completed' && run.conclusion === 'success' && run.head_sha === sha && run.path === '.github/workflows/package-pub.yml');
          if (!run) throw Error('Stage and verify this exact committed source before pushing a publication tag');
          appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${run.id}\n`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: public-flutter-staging
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .build/verified-public
      - name: Validate and publish the frozen archive using OIDC
        run: node tools/publish-public.mjs --distribution .build/verified-public --package weapp_container_platform_interface --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-interface-publication-receipts
          path: |
            .build/verified-public/*-archive.json
            .build/verified-public/*-publication.json
          if-no-files-found: ignore
          retention-days: 30
