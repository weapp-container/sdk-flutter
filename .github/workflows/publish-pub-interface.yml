name: Publish verified Flutter package
on:
  push:
    tags:
      - 'weapp_container_platform_interface-v*'
      - 'weapp_container_android-v*'
      - 'weapp_container_ios-v*'
      - 'weapp_container_macos-v*'
      - 'weapp_container_linux-v*'
      - 'weapp_container_windows-v*'
      - 'weapp_container-v*'
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Resolve the package from the exact publication tag
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            weapp_container_platform_interface-v*) package=weapp_container_platform_interface ;;
            weapp_container_android-v*) package=weapp_container_android ;;
            weapp_container_ios-v*) package=weapp_container_ios ;;
            weapp_container_macos-v*) package=weapp_container_macos ;;
            weapp_container_linux-v*) package=weapp_container_linux ;;
            weapp_container_windows-v*) package=weapp_container_windows ;;
            weapp_container-v*) package=weapp_container ;;
            *) echo "Unsupported Flutter publication tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "name=$package" >> "$GITHUB_OUTPUT"
      - name: Select a successful staging run at this exact source
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const runs = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/package-pub.yml/runs?head_sha=${sha}&status=success&per_page=100`])).workflow_runs;
          const run = runs.find(run => run.status === 'completed' && run.conclusion === 'success' && run.head_sha === sha && run.path === '.github/workflows/package-pub.yml');
          if (!run) throw Error('Stage and verify this exact committed source before pushing a publication tag');
          appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${run.id}\n`);
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: public-flutter-staging
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-public
      - name: Enforce interface, platform, then main-package publication order
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const packageName = process.env.PACKAGE;
          const version = process.env.VERSION.slice(process.env.VERSION.indexOf('-v') + 2);
          const dependencies = {
            weapp_container_android: ['weapp_container_platform_interface'],
            weapp_container_ios: ['weapp_container_platform_interface'],
            weapp_container_macos: ['weapp_container_platform_interface'],
            weapp_container_linux: ['weapp_container_platform_interface'],
            weapp_container_windows: ['weapp_container_platform_interface'],
            weapp_container: [
              'weapp_container_platform_interface', 'weapp_container_android',
              'weapp_container_ios', 'weapp_container_macos',
              'weapp_container_linux', 'weapp_container_windows',
            ],
          };
          for (const dependency of dependencies[packageName] ?? []) {
            const url = `https://pub.dev/api/packages/${dependency}/versions/${version}`;
            const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
            if (!response.ok) throw new Error(`Publish ${dependency}@${version} before ${packageName}: ${response.status}`);
          }
          NODE
      - name: Validate and publish the frozen archive using OIDC
        run: node tools/publish-public.mjs --distribution "$RUNNER_TEMP/verified-public" --package "${{ steps.package.outputs.name }}" --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-interface-publication-receipts
          path: |
            ${{ runner.temp }}/verified-public/*-archive.json
            ${{ runner.temp }}/verified-public/*-publication.json
          if-no-files-found: ignore
          retention-days: 30
