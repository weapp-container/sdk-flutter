name: Build anonymous pub.dev consumers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    name: Public consumer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: android }
          - { os: xcode-27, platform: ios }
          - { os: xcode-27, platform: macos }
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-2022, platform: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Apple build tools
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Install Linux consumer dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang pkg-config libgtk-3-dev libepoxy-dev libfontconfig1-dev libcurl4-openssl-dev
      - name: Create and compile a fresh hosted-package consumer
        run: node tools/public-consumer.mjs ${{ matrix.platform }}
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          WEAPP_CONTAINER_RUNTIME_TOKEN: ''
          SDK_REPOSITORIES_READ_TOKEN: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-consumer-${{ matrix.platform }}
          path: .build/public-consumer/${{ matrix.platform }}/evidence/
          if-no-files-found: error
          retention-days: 30
