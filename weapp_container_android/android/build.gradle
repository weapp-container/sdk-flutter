group = 'dev.weapp.container.flutter'
version = '0.1.0-preview.7.0'
buildscript {
    ext.kotlin_version = '2.0.21'
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.7.3'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'dev.weapp.container.flutter'
    compileSdk 36
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// Maven Central is the default installation source. A local repository is an explicit build-test override.
def sdkMavenOverride = project.findProperty('weappSdkMavenDir')
rootProject.allprojects {
    repositories {
        if (sdkMavenOverride) { maven { url = uri(sdkMavenOverride); content { includeGroup 'io.github.weapp-container' } } }
        google()
        mavenCentral()
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'io.github.weapp-container:weapp-container-android:0.1.0-preview.7.0'
}
