group = 'dev.weapp.container.flutter'
version = '0.1.0-preview.5.5'
buildscript {
    ext.kotlin_version = '2.0.21'
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.7.3'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'dev.weapp.container.flutter'
    compileSdk 36
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// The host app resolves the plugin's transitive AAR as well. Register the
// packaged repository for every consumer project, restricted to this SDK group.
def sdkMaven = file(project.findProperty('weappSdkMavenDir') ?: "$projectDir/../native/maven")
def requiredAar = new File(sdkMaven, 'com/sonofmagic/weapp/weapp-container-android/0.1.0-preview.5.5/weapp-container-android-0.1.0-preview.5.5.aar')
if (!requiredAar.isFile()) throw new GradleException('Missing pinned Android SDK; run node tools/prepare-native.mjs --platform android --arch universal from sdk-flutter. Core sources are never built by this plugin.')

rootProject.allprojects {
    repositories {
        maven { url = sdkMaven; content { includeGroup 'com.sonofmagic.weapp' } }
        google(); mavenCentral()
    }
}
dependencies {
    implementation 'com.sonofmagic.weapp:weapp-container-android:0.1.0-preview.5.5'
    testImplementation 'junit:junit:4.13.2'
}
